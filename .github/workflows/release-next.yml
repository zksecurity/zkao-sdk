name: Release next

# Branch `next` tracks staging (staging.zkao.io). Every push publishes both
# packages as `X.Y.Z-next.<run>` under the npm dist-tag `next`; `latest` stays
# the production release.

on:
  push:
    branches: [next]
    # A docs-only push changes neither package.
    paths-ignore: ["docs/**"]

concurrency:
  group: release-next
  cancel-in-progress: false

# Trusted publishing: npm verifies this workflow's OIDC identity, so there is
# no token secret. Each package needs a trusted publisher on npmjs.com for this
# repo and workflow file, with direct publish allowed.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a recent npm CLI.
      - run: npm install -g npm@latest

      - name: Set the prerelease version on both packages
        run: |
          VERSION="$(bun -e 'console.log(require("./packages/cli/package.json").version.split("-")[0])')-next.${{ github.run_number }}"
          for pkg in packages/sdk packages/cli; do
            bun -e "const f='$pkg/package.json'; const p=require('./'+f); p.version='$VERSION'; require('fs').writeFileSync(f, JSON.stringify(p, null, 2)+'\n')"
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # bun.lock records each workspace version and bun publish resolves the
      # CLI's workspace:* dependency from it, so regenerate after the bump.
      - run: rm bun.lock && bun install
      - run: bun run build
      - run: bun run typecheck

      # bun pack rewrites the CLI's workspace:* dependency to the real version;
      # npm then publishes the packed tarballs (npm alone would ship workspace:*).
      - name: Pack both packages
        run: |
          (cd packages/sdk && bun pm pack --destination "$RUNNER_TEMP/pkgs")
          (cd packages/cli && bun pm pack --destination "$RUNNER_TEMP/pkgs")

      - name: Check the CLI depends on the same SDK prerelease
        run: |
          DEP="$(tar -xzOf "$RUNNER_TEMP"/pkgs/zksecurity-zkao-cli-*.tgz package/package.json | bun -e 'console.log(JSON.parse(await Bun.stdin.text()).dependencies["@zksecurity/zkao-sdk"])')"
          echo "cli depends on @zksecurity/zkao-sdk@$DEP"
          test "$DEP" = "$VERSION"

      - name: Publish the SDK, then the CLI
        run: |
          npm publish "$RUNNER_TEMP"/pkgs/zksecurity-zkao-sdk-*.tgz --tag next --access public
          npm publish "$RUNNER_TEMP"/pkgs/zksecurity-zkao-cli-*.tgz --tag next --access public
